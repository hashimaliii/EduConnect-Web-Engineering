services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
  cliet:
    build: 
      context: ./client
      args:
        - VITE_API_URL=http://localhost:5000
    ports:
      - "8090:80"
    env_file:
      - ./client/.env
    depends_on:
      - server